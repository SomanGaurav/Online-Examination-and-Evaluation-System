<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Online Examination &amp; Evaluation System</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-title">
        <h1>Exam<span style="color:var(--accent)">Eval</span></h1>
        <p class="muted small">Online examination &amp; evaluation platform</p>
      </div>

      <div class="card">
        <div class="tabs">
          <button id="tabLogin" class="active" type="button">Sign in</button>
          <button id="tabRegister" type="button">Register</button>
        </div>

        <form id="loginForm">
          <div class="field">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" type="email" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" type="password" autocomplete="current-password" required />
          </div>
          <button class="btn" style="width:100%; justify-content:center" type="submit">Sign in</button>
        </form>

        <form id="registerForm" hidden>
          <div class="field">
            <label for="regName">Full name</label>
            <input id="regName" type="text" required />
          </div>
          <div class="field">
            <label for="regEmail">Email</label>
            <input id="regEmail" type="email" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="regRoll">Roll number</label>
            <input id="regRoll" type="text" placeholder="CE22123" />
          </div>
          <div class="field">
            <label for="regPassword">Password (min 8 characters)</label>
            <input id="regPassword" type="password" autocomplete="new-password" minlength="8" required />
          </div>
          <button class="btn" style="width:100%; justify-content:center" type="submit">Create student account</button>
          <p class="small muted" style="margin-top:.6rem">
            Teacher and admin accounts are provisioned by an administrator.
          </p>
        </form>

        <div class="demo-creds">
          <strong>Seeded demo logins</strong><br />
          teacher — <code>teacher@campus.edu</code><br />
          student — <code>student001@campus.edu</code><br />
          password — <code>Password@123</code>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
