<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exam builder · ExamEval</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main>
    <div class="page-head">
      <div>
        <h1 id="examTitle">Loading…</h1>
        <p class="muted small" id="examMeta"></p>
      </div>
      <div class="row">
        <select id="statusSelect">
          <option value="draft">Draft</option>
          <option value="published">Published</option>
          <option value="closed">Closed</option>
        </select>
        <a class="btn btn-secondary" href="/teacher.html">Back</a>
      </div>
    </div>

    <div class="grid grid-2">
      <section class="card">
        <div class="card-head"><h2>Add question</h2></div>
        <form id="questionForm">
          <div class="row">
            <div class="field" style="flex:2">
              <label for="qType">Type</label>
              <select id="qType">
                <option value="mcq">Single choice (MCQ)</option>
                <option value="multi-select">Multiple choice</option>
                <option value="true-false">True / False</option>
                <option value="numeric">Numeric</option>
                <option value="short-answer">Short answer</option>
                <option value="long-answer">Long answer</option>
              </select>
            </div>
            <div class="field" style="flex:1">
              <label for="qMarks">Marks</label>
              <input id="qMarks" type="number" min="0.5" step="0.5" value="2" required />
            </div>
            <div class="field" style="flex:1">
              <label for="qTopic">Topic</label>
              <input id="qTopic" value="general" />
            </div>
          </div>
          <div class="field">
            <label for="qPrompt">Question</label>
            <textarea id="qPrompt" required></textarea>
          </div>

          <div id="optionsHost"></div>

          <div class="field" id="numericField" hidden>
            <label for="qNumericAnswer">Correct numeric answer</label>
            <input id="qNumericAnswer" type="number" step="any" />
            <label for="qTolerance" style="margin-top:.5rem">Tolerance (±)</label>
            <input id="qTolerance" type="number" step="any" value="0" />
          </div>

          <div class="field" id="essayField" hidden>
            <label for="qModelAnswer">Model answer (for evaluators)</label>
            <textarea id="qModelAnswer"></textarea>
            <label for="qRubric" style="margin-top:.5rem">Rubric</label>
            <textarea id="qRubric"></textarea>
          </div>

          <button type="submit" class="btn" style="width:100%; justify-content:center">Add question</button>
        </form>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Question bank</h2>
          <span class="badge" id="totalMarksBadge">0 marks</span>
        </div>
        <div id="questionList"><p class="muted small">Loading…</p></div>
      </section>
    </div>
  </main>

  <script type="module" src="/js/exam-builder.js"></script>
</body>
</html>
